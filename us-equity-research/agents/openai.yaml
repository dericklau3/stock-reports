interface:
  display_name: "us-equity-research"
  short_description: "完整深研美股公司，分析业务竞争力、重大事件日期、经营进展、财务、估值与风险"
  default_prompt: "使用 $us-equity-research 对指定的美国上市公司开展完整中文深度研究，说明公司业务、已公布重大事件及公告日期与原始来源、真实项目进展、财务与悲观/基础/乐观三档每股估值区间（基础上下限必须由最近连续2–3季已公布财报驱动，每档须有明确上下限及计算依据）、主要风险，以及相对上次研究的变化。每次研究均生成完整深研报告；报告保持简洁、数据准确。"
