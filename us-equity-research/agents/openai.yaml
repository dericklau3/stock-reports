interface:
  display_name: "us-equity-research"
  short_description: "完整深研美股公司，分析重大事件日期、经营进展、估值与风险"
  default_prompt: "使用 $us-equity-research 对指定的美国上市公司开展完整中文深度研究，说明已公布重大事件及公告日期与原始来源、真实项目进展、悲观/基础/乐观三档每股估值区间（基础上下限必须由最近连续2–3季已公布财报驱动，每档须有明确上下限及计算依据）、主要风险，以及相对上次研究的变化。每次研究均生成完整深研报告；报告仅保留重大事件、经营进展、估值分析、主要投资风险四章，不生成业务介绍、管理层与资本分配或财务状况独立章节；财报仍作为估值和风险核验依据，详细数据留底稿。"
