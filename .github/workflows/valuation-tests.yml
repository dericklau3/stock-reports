name: Valuation engine tests

on:
  push:
    paths:
      - 'us-equity-research/**'
      - '.github/workflows/valuation-tests.yml'
  pull_request:
    paths:
      - 'us-equity-research/**'
      - '.github/workflows/valuation-tests.yml'

jobs:
  valuation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: P0 deterministic scenario regression tests
        run: python -m unittest discover -s us-equity-research/tests -p 'test_valuation_engine.py' -v
      - name: P1 annual DCF, forward P/E and SOTP regression tests
        run: python -m unittest discover -s us-equity-research/tests -p 'test_valuation_p1.py' -v
      - name: Run P1 example end-to-end
        run: python us-equity-research/valuation_p1.py us-equity-research/examples/valuation-p1-input.example.json --output /tmp/p1-result.json
